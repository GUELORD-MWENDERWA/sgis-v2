services:
  - type: web
    name: school-management-api
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn school_management.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: school_management_db
          property: connectionString

databases:
  - name: school_management_db
